<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연금복권 번호 생성기</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #777777;
            --border-color: #E1E4E8;
            
            --color-1: #E74C3C;
            --color-2: #F39C12;
            --color-3: #2ECC71;
            --color-4: #3498DB;
            --color-5: #9B59B6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }

        .setting-section {
            margin-bottom: 24px;
        }

        .setting-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: center;
        }

        .selectors-container {
            display: grid;
            grid-template-columns: 1.2fr repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 20px;
        }

        .select-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .select-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            background-color: #FFF;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .display-section {
            background: #F8FAFC;
            border-radius: 16px;
            padding: 20px 12px;
            margin-bottom: 24px;
            border: 1px dashed var(--border-color);
        }

        .balls-row {
            display: grid;
            grid-template-columns: 1.2fr repeat(6, 1fr);
            gap: 6px;
            align-items: center;
            justify-items: center;
        }

        .ball {
            width: 100%;
            aspect-ratio: 1;
            max-width: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s ease;
        }

        .group-ball { background-color: #34495E; font-size: 15px; border-radius: 12px; }
        .ball-c0 { background-color: var(--color-1); }
        .ball-c1 { background-color: var(--color-2); }
        .ball-c2 { background-color: var(--color-3); }
        .ball-c3 { background-color: var(--color-4); }
        .ball-c4 { background-color: var(--color-5); }
        .ball-c5 { background-color: #7F8C8D; }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-generate:active {
            transform: scale(0.98);
            background-color: #357ABD;
        }

        .history-section {
            margin-top: 28px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            display: grid;
            grid-template-columns: 1.2fr repeat(6, 1fr);
            gap: 6px;
            align-items: center;
            justify-items: center;
            padding: 8px;
            background: #FAFAFA;
            border-radius: 10px;
        }

        .hist-ball {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }
        .hist-group {
            font-size: 12px;
            font-weight: bold;
            color: #34495E;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="setting-section">
        <div class="setting-title">각 자리별 숫자 설정 (지정 시 고정)</div>
        <div class="selectors-container">
            <div class="select-wrapper">
                <span class="select-label">조</span>
                <select id="set-group">
                    <option value="R">랜덤</option>
                    <option value="1">1조</option>
                    <option value="2">2조</option>
                    <option value="3">3조</option>
                    <option value="4">4조</option>
                    <option value="5">5조</option>
                </select>
            </div>
            <div class="select-wrapper"><span class="select-label">십만</span><select class="set-num" data-idx="0"><option value="R">랜덤</option></select></div>
            <div class="select-wrapper"><span class="select-label">만</span><select class="set-num" data-idx="1"><option value="R">랜덤</option></select></div>
            <div class="select-wrapper"><span class="select-label">천</span><select class="set-num" data-idx="2"><option value="R">랜덤</option></select></div>
            <div class="select-wrapper"><span class="select-label">백</span><select class="set-num" data-idx="3"><option value="R">랜덤</option></select></div>
            <div class="select-wrapper"><span class="select-label">십</span><select class="set-num" data-idx="4"><option value="R">랜덤</option></select></div>
            <div class="select-wrapper"><span class="select-label">일</span><select class="set-num" data-idx="5"><option value="R">랜덤</option></select></div>
        </div>
    </div>

    <div class="display-section">
        <div class="balls-row">
            <div class="ball group-ball" id="res-group">-</div>
            <div class="ball ball-c0" id="res-n0">-</div>
            <div class="ball ball-c1" id="res-n1">-</div>
            <div class="ball ball-c2" id="res-n2">-</div>
            <div class="ball ball-c3" id="res-n3">-</div>
            <div class="ball ball-c4" id="res-n4">-</div>
            <div class="ball ball-c5" id="res-n5">-</div>
        </div>
    </div>

    <button class="btn-generate" onclick="generateNumbers()">번호 생성하기</button>

    <div class="history-section">
        <div class="setting-title">최근 생성 이력 (최대 5개)</div>
        <div class="history-list" id="history-list"></div>
    </div>
</div>

<script>
    // 초기 드롭다운 0~9 설정 채우기
    document.querySelectorAll('.set-num').forEach(select => {
        for(let i=0; i<=9; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            select.appendChild(opt);
        }
    });

    let historyData = [];

    function generateNumbers() {
        // 조 결정
        const groupSelect = document.getElementById('set-group').value;
        const finalGroup = groupSelect === 'R' ? Math.floor(Math.random() * 5) + 1 : parseInt(groupSelect);

        // 6자리 숫자 결정
        const finalNums = [];
        const numSelects = document.querySelectorAll('.set-num');
        
        numSelects.forEach((select, idx) => {
            const val = select.value;
            if (val === 'R') {
                finalNums.push(Math.floor(Math.random() * 10));
            } else {
                finalNums.push(parseInt(val));
            }
        });

        // 화면 반영
        document.getElementById('res-group').textContent = finalGroup + '조';
        for(let i=0; i<6; i++) {
            document.getElementById(`res-n${i}`).textContent = finalNums[i];
        }

        // 이력 추가
        addHistory(finalGroup, finalNums);
    }

    function addHistory(group, nums) {
        historyData.unshift({group, nums});
        if(historyData.length > 5) historyData.pop();

        const listEl = document.getElementById('history-list');
        listEl.innerHTML = '';

        historyData.forEach(item => {
            const row = document.createElement('div');
            row.className = 'history-item';
            
            const gEl = document.createElement('div');
            gEl.className = 'hist-group';
            gEl.textContent = item.group + '조';
            row.appendChild(gEl);

            item.nums.forEach(n => {
                const nEl = document.createElement('div');
                nEl.className = 'hist-ball';
                nEl.textContent = n;
                row.appendChild(nEl);
            });

            listEl.appendChild(row);
        });
    }
</script>
</body>
</html>
